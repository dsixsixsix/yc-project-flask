version: "3.9"

services:
  # Балансировщик нагрузки - в публичной подсети (frontend)
  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - frontend-network
      - backend-network
    depends_on:
      - app

  # Backend приложение - во внутренней подсети (backend)
  app:
    build: .
    env_file:
      - .env
    environment:
      # Для docker-сети MinIO будет доступен по имени сервиса minio
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      PORT: "7777"
    networks:
      - backend-network
    volumes:
      - app-db:/app/instance
    depends_on:
      - minio
    expose:
      - "7777"

  # Object Storage - во внутренней подсети storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    networks:
      - backend-network
      - storage-network
    ports:
      - "9000:9000"
      - "9001:9001"

# Виртуальные сети (VPC) - эмуляция Yandex Cloud VPC
networks:
  # Публичная подсеть - для балансировщика (доступ извне)
  frontend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

  # Внутренняя подсеть - для backend сервисов (изолирована)
  backend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
          gateway: 172.21.0.1

  # Подсеть для storage - дополнительная изоляция
  storage-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
          gateway: 172.22.0.1

volumes:
  minio-data:
  app-db:

